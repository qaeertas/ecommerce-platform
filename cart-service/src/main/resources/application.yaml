server:
  port: 8082

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://localhost:5433/cart_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}