server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/order_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

services:
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  cart-url: ${CART_SERVICE_URL:http://localhost:8082}